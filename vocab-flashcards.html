<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Word Stack - PSAT 10+ Vocabulary</title>
<style>
  :root{
    --ink:#15172a; --ink-2:#1d2038;
    --paper:#fbf6ea; --paper-edge:#efe6d2;
    --text:#23202b; --muted:#6f6a7d;
    --gold:#d99b34; --gold-soft:#f4e3c0;
    --coral:#e0654f; --coral-soft:#f7d9d2;
    --line:#33365a; --on-ink:#e7e4f0; --on-ink-dim:#9a98b5;
    --drawerw:288px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #20243f 0%, var(--ink) 55%, #0f1120 100%);
    color:var(--on-ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100%;display:flex;flex-direction:column;align-items:center;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  .wrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px;flex:1;}
  header{display:flex;flex-direction:column;gap:10px;}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand-l{display:flex;align-items:center;gap:11px;}
  .topbtn{width:38px;height:38px;flex:none;border:1px solid var(--line);background:#21243d;color:var(--on-ink);border-radius:10px;font-size:16px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .topbtn:active{background:#2c2f4f;}
  .brand h1{font-family:Georgia,"Times New Roman",serif;font-size:21px;font-weight:700;margin:0;color:var(--on-ink);}
  .brand h1 span{color:var(--gold);}
  .brand .sub{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-ink-dim);text-align:right;line-height:1.5;}
  .meter{display:flex;flex-direction:column;gap:6px;}
  .meter-row{display:flex;justify-content:space-between;font-size:12px;color:var(--on-ink-dim);}
  .meter-row b{color:var(--gold);font-weight:600;}
  .bar{height:6px;border-radius:99px;background:#2a2d4d;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--gold));transition:width .35s ease;}
  .search{position:relative;}
  .search input{width:100%;background:#21243d;border:1px solid var(--line);border-radius:11px;color:var(--on-ink);font-size:15px;padding:11px 36px 11px 38px;font-family:inherit;outline:none;}
  .search input::placeholder{color:#7d7b9b;}
  .search input:focus{border-color:var(--gold);}
  .search .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#7d7b9b;font-size:15px;}
  .search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:#7d7b9b;font-size:18px;cursor:pointer;padding:4px 8px;}
  .seg{display:flex;background:#23264180;border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;}
  .seg button{flex:1;border:0;background:transparent;color:var(--on-ink-dim);font-size:12.5px;font-weight:600;padding:8px 6px;border-radius:8px;cursor:pointer;transition:.15s;font-family:inherit;}
  .seg button.on{background:var(--on-ink);color:var(--ink);}
  .banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(90deg,#3a2f1a,#2a2741);border:1px solid var(--gold);border-radius:11px;padding:9px 12px;font-size:12.5px;color:var(--gold-soft);}
  .banner b{color:var(--gold);}
  .banner button{border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:8px;font-size:11.5px;font-weight:700;padding:5px 10px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .stage{position:relative;perspective:1400px;min-height:316px;display:flex;align-items:center;justify-content:center;}
  .stage::before,.stage::after{content:"";position:absolute;left:50%;top:50%;width:88%;height:290px;border-radius:18px;background:var(--paper-edge);transform:translate(-50%,-46%) rotate(-2.2deg);box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:0;}
  .stage::after{transform:translate(-50%,-48%) rotate(1.6deg);opacity:.75;}
  .card{position:relative;z-index:2;width:100%;max-width:430px;height:300px;cursor:pointer;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);}
  .card.flipped{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;border-radius:18px;padding:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:linear-gradient(180deg,var(--paper) 0%,#f6efdd 100%);color:var(--text);box-shadow:0 18px 44px rgba(0,0,0,.45);display:flex;flex-direction:column;border:1px solid rgba(0,0,0,.05);}
  .face.back{transform:rotateY(180deg);}
  .face .top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .chip{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);}
  .pos{font-style:italic;font-family:Georgia,serif;color:var(--muted);font-size:15px;}
  .word{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.05;margin:auto 0;font-size:clamp(32px,8.5vw,44px);color:#1b1822;text-align:center;}
  .hint{font-size:12px;color:var(--muted);text-align:center;margin-top:6px;}
  .status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;}
  .status-dot.learning{background:var(--coral);}
  .status-dot.mastered{background:var(--gold);}
  .status-dot.new{background:#c9c1ad;}
  .back .defn{font-size:19px;line-height:1.45;font-weight:500;margin:6px 0 14px;color:#221f29;}
  .back .ex-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .back .ex{font-family:Georgia,serif;font-style:italic;font-size:16px;line-height:1.5;color:#3a3640;margin-top:4px;}
  .back .word-sm{font-family:Georgia,serif;font-weight:700;font-size:18px;color:#1b1822;}
  .marks{display:flex;gap:10px;}
  .mark{flex:1;border:1.5px solid var(--line);background:#21243d;color:var(--on-ink);border-radius:13px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;display:flex;align-items:center;justify-content:center;gap:7px;}
  .mark.review.on{background:var(--coral);border-color:var(--coral);color:#fff;}
  .mark.got.on{background:var(--gold);border-color:var(--gold);color:#3a2807;}
  .nav{display:flex;align-items:center;gap:10px;}
  .nav .count{flex:1;text-align:center;font-size:13px;color:var(--on-ink-dim);font-variant-numeric:tabular-nums;}
  .nav .count b{color:var(--on-ink);}
  .icn{width:48px;height:46px;border:1px solid var(--line);background:#21243d;color:var(--on-ink);border-radius:13px;font-size:20px;cursor:pointer;font-family:inherit;transition:.15s;display:flex;align-items:center;justify-content:center;}
  .icn:active{background:#2c2f4f;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;}
  .toolbar button{flex:1 1 30%;border:1px solid var(--line);background:#1d2038;color:var(--on-ink-dim);border-radius:11px;padding:10px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
  .toolbar button:active{background:#2c2f4f;color:var(--on-ink);}
  .toolbar button.accent{background:var(--gold);border-color:var(--gold);color:#3a2807;font-weight:700;flex:1 1 100%;}
  .toolbar button.accent:active{background:#c98a26;color:#3a2807;}
  .kb{font-size:11px;color:var(--on-ink-dim);text-align:center;line-height:1.7;}
  .kb kbd{background:#262a48;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--on-ink);}
  .empty{text-align:center;color:var(--on-ink-dim);font-size:14px;padding:40px 10px;}
  .backdrop{position:fixed;inset:0;background:rgba(8,9,18,.55);opacity:0;visibility:hidden;transition:.25s;z-index:40;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);}
  .backdrop.open{opacity:1;visibility:visible;}
  .drawer{position:fixed;top:0;left:0;height:100%;width:var(--drawerw);max-width:84vw;z-index:50;background:linear-gradient(180deg,#1b1e36 0%,#15172a 100%);border-right:1px solid var(--line);box-shadow:8px 0 40px rgba(0,0,0,.5);display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.7,.2,1);padding-top:env(safe-area-inset-top);}
  .drawer.open{transform:translateX(0);}
  .ix-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;border-bottom:1px solid var(--line);}
  .ix-head .t{font-family:Georgia,serif;font-size:16px;font-weight:700;color:var(--on-ink);}
  .ix-head .t small{display:block;font-family:-apple-system,sans-serif;font-size:11px;font-weight:400;letter-spacing:.05em;color:var(--on-ink-dim);text-transform:uppercase;margin-top:2px;}
  .ix-close{width:32px;height:32px;border:1px solid var(--line);background:#21243d;color:var(--on-ink);border-radius:9px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .ix-list{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:6px 6px 24px;}
  .ix-letter{position:sticky;top:0;background:#171a30;color:var(--gold);font-weight:700;font-size:11px;letter-spacing:.12em;padding:6px 12px;z-index:1;}
  .ix-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--on-ink);font-size:14.5px;}
  .ix-row:active{background:#262a48;}
  .ix-row.cur{background:#2c2f52;}
  .ix-row.cur .ix-w{color:var(--gold);font-weight:700;}
  .ix-row .ix-w{font-family:Georgia,serif;}
  .ix-row .ix-p{margin-left:auto;font-style:italic;font-size:12px;color:var(--on-ink-dim);}
  .ix-dot{width:8px;height:8px;border-radius:50%;flex:none;background:transparent;border:1px solid #4a4d70;}
  .ix-dot.learning{background:var(--coral);border-color:var(--coral);}
  .ix-dot.mastered{background:var(--gold);border-color:var(--gold);}
  @media (prefers-reduced-motion:reduce){.card,.bar i,.drawer,.backdrop{transition:none;}}
</style>
</head>
<body>
<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="ix-head">
    <div class="t">Word index<small id="ixCount"></small></div>
    <button class="ix-close" id="ixClose" aria-label="Close index">&times;</button>
  </div>
  <div class="ix-list" id="ixList"></div>
</aside>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-l">
        <button class="topbtn" id="ixToggle" aria-label="Open word index">&#9776;</button>
        <h1>Word<span>Stack</span></h1>
      </div>
      <div class="sub">PSAT 10 &amp; up<br>1,079 words</div>
    </div>
    <div class="meter">
      <div class="meter-row"><span id="filterLabel">All words</span><span><b id="mCount">0</b> mastered</span></div>
      <div class="bar"><i id="mBar"></i></div>
    </div>
    <div class="search">
      <span class="mag">&#9906;</span>
      <input id="search" type="text" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search a word or definition...">
      <button class="clr" id="clr" aria-label="Clear" style="display:none;">&times;</button>
    </div>
    <div class="seg" id="statusSeg">
      <button data-status="all" class="on">All</button>
      <button data-status="learning">Still learning</button>
      <button data-status="mastered">Mastered</button>
    </div>
  </header>

  <div class="banner" id="banner" style="display:none;">
    <span id="bannerText"></span>
    <button id="bannerExit">Exit set &times;</button>
  </div>

  <div class="stage" id="stage">
    <div class="card" id="card">
      <div class="face front">
        <div class="top"><span class="chip" id="chip"></span><span class="status-dot new" id="dot"></span></div>
        <div class="word" id="word">-</div>
        <div class="pos" id="pos" style="text-align:center;"></div>
        <div class="hint">tap to flip</div>
      </div>
      <div class="face back">
        <div class="top"><span class="word-sm" id="wordBack">-</span><span class="pos" id="posBack"></span></div>
        <div class="defn" id="defn"></div>
        <div style="margin-top:auto;"><div class="ex-label">In a sentence</div><div class="ex" id="ex"></div></div>
      </div>
    </div>
  </div>

  <div class="marks">
    <button class="mark review" id="btnReview">&#8634; Still learning</button>
    <button class="mark got" id="btnGot">&#10003; Got it</button>
  </div>
  <div class="nav">
    <button class="icn" id="prev" aria-label="Previous">&#8249;</button>
    <div class="count"><b id="idx">0</b> / <span id="total">0</span></div>
    <button class="icn" id="next" aria-label="Next">&#8250;</button>
  </div>
  <div class="toolbar">
    <button id="pick20" class="accent">&#127919; Pick 20 to study</button>
    <button id="shuffle">&#128256; Shuffle</button>
    <button id="reset">&#8635; Reset progress</button>
  </div>
  <div class="kb"><kbd>Space</kbd> flip &middot; <kbd>&larr;</kbd><kbd>&rarr;</kbd> move &middot; <kbd>&uarr;</kbd> got it &middot; <kbd>&darr;</kbd> still learning</div>
</div>

<script>
const RAW = [["abase","v.","to lower in rank or dignity; to humble","He refused to abase himself by begging for the job."],["abate","v.","to lessen in intensity or amount","The storm finally began to abate by morning."],["abdicate","v.","to give up power or responsibility","The king chose to abdicate the throne."],["aberration","n.","a deviation from what is normal","The cold day was an aberration in a warm summer."],["abet","v.","to encourage or assist, usually wrongdoing","He was charged with helping to abet the crime."],["abhor","v.","to hate intensely","She abhors cruelty of any kind."],["abject","adj.","extremely bad; utterly hopeless","The family lived in abject poverty."],["abnegation","n.","the denial or giving up of something","Her abnegation of luxury surprised everyone."],["abolish","v.","to formally put an end to","The law was passed to abolish the old tax."],["abridge","v.","to shorten while keeping the main content","The editor abridged the long novel."],["abrogate","v.","to abolish or cancel a law or agreement","The treaty was abrogated after the war."],["abscond","v.","to leave quickly and secretly to avoid capture","The cashier absconded with the money."],["absolve","v.","to clear of blame or guilt","The report absolved the pilot of any fault."],["abstain","v.","to choose not to do something","She abstained from voting on the issue."],["abstemious","adj.","sparing, especially in eating and drinking","His abstemious habits kept him healthy."],["abstruse","adj.","difficult to understand; obscure","The lecture was too abstruse for beginners."],["abysmal","adj.","extremely bad","The team's performance was abysmal."],["accentuate","v.","to emphasize or make more noticeable","The dress accentuated her height."],["acclaim","n.","enthusiastic public praise","The film received critical acclaim."],["accolade","n.","an award or expression of praise","The novel earned every literary accolade."],["accost","v.","to approach and speak to boldly or aggressively","A stranger accosted her on the street."],["acerbic","adj.","sharp and harsh in tone","The critic was known for acerbic reviews."],["acquiesce","v.","to accept or agree reluctantly","She acquiesced to her parents' wishes."],["acrid","adj.","sharp and bitter in smell or taste","The acrid smoke filled the room."],["acrimony","n.","bitterness or sharp ill feeling","The negotiations ended in acrimony."],["acumen","n.","keen insight and good judgment","Her business acumen built the company."],["acute","adj.","sharp, intense, or perceptive","He has an acute sense of hearing."],["adamant","adj.","refusing to be persuaded; unyielding","She was adamant about leaving early."],["adept","adj.","highly skilled","He is adept at solving puzzles."],["admonish","v.","to warn or scold gently","The teacher admonished the noisy students."],["adroit","adj.","clever and skillful, especially with the hands","The adroit magician fooled the crowd."],["adulation","n.","excessive admiration or flattery","The star basked in the fans' adulation."],["adulterate","v.","to make impure by adding something inferior","The milk was adulterated with water."],["adverse","adj.","unfavorable; harmful","Adverse weather canceled the game."],["advocate","v.","to publicly support a cause","She advocates for cleaner energy."],["aesthetic","adj.","concerned with beauty or appearance","The design had strong aesthetic appeal."],["affable","adj.","friendly and easy to talk to","Our affable host welcomed everyone."],["affinity","n.","a natural liking or connection","She has an affinity for languages."],["affluent","adj.","wealthy","They live in an affluent neighborhood."],["affront","n.","an open insult","His rude reply was an affront to her."],["aggrandize","v.","to increase power, wealth, or reputation","The ruler sought to aggrandize his empire."],["aggregate","n.","a total formed from many parts","The aggregate of the scores was high."],["agile","adj.","able to move quickly and easily","The agile cat leapt to the shelf."],["agnostic","n.","one who believes the existence of God is unknown","As an agnostic, he avoided the debate."],["agrarian","adj.","relating to farmland or farming","The agrarian society depended on crops."],["alacrity","n.","brisk and cheerful readiness","She accepted the task with alacrity."],["allay","v.","to calm or reduce fear or worry","The doctor allayed their fears."],["allege","v.","to claim without proof","They allege that he broke the rules."],["alleviate","v.","to make suffering less severe","The medicine alleviated her pain."],["allocate","v.","to assign or distribute for a purpose","Funds were allocated to the schools."],["allude","v.","to refer to indirectly","She alluded to her past without details."],["aloof","adj.","distant and uninvolved","He stayed aloof at the party."],["altercation","n.","a noisy argument or quarrel","An altercation broke out in the parking lot."],["altruism","n.","unselfish concern for others","Her altruism led her to volunteer."],["amalgamate","v.","to combine into one","The two firms amalgamated last year."],["ambiguous","adj.","open to more than one interpretation; unclear","The ending of the film was ambiguous."],["ambivalent","adj.","having mixed feelings","She felt ambivalent about moving away."],["ameliorate","v.","to make a bad situation better","New laws aimed to ameliorate poverty."],["amenable","adj.","willing to agree or cooperate","He was amenable to the new plan."],["amiable","adj.","good-natured and likable","Their amiable neighbor often helped out."],["amicable","adj.","friendly; without serious conflict","They reached an amicable agreement."],["amorphous","adj.","without a clear shape or form","The plan was still amorphous and vague."],["anachronism","n.","something out of its proper time","A cell phone in a medieval film is an anachronism."],["analogous","adj.","similar in a way that allows comparison","The heart is analogous to a pump."],["anecdote","n.","a short, often amusing personal story","She t   const o=deck[pos];
  flipped=false; $("card").classList.remove("flipped");
  $("idx").textContent=pos+1;
  $("word").textContent=o.w; $("pos").textContent=o.p;
  $("wordBack").textContent=o.w; $("posBack").textContent=o.p;
  $("defn").textContent=o.d; $("ex").textContent=o.e;
  $("chip").textContent=o.w.charAt(0).toUpperCase();
  const s=statusOf(o);
  $("dot").className="status-dot "+s;
  $("btnReview").classList.toggle("on",s==="learning");
  $("btnGot").classList.toggle("on",s==="mastered");
  syncIndex();
}

function syncIndex(){
  const sig = (sessionMode?"S":statusFilter)+"|"+query.trim().toLowerCase()+"|"+(shuffled?"s":"a")+"|"+sessionList.length+"|"+JSON.stringify(progress).length;
  if(sig!==lastSig){ rebuildIndex(); lastSig=sig; }
  highlightIndex();
}
function rebuildIndex(){
  $("ixCount").textContent = deck.length + (deck.length===1?" word":" words");
  const alpha = !shuffled && !sessionMode && query.trim()==="";
  let html="", prev="";
  for(let i=0;i<deck.length;i++){
    const o=deck[i];
    if(alpha){ const L=o.w.charAt(0).toUpperCase(); if(L!==prev){ html+='<div class="ix-letter">'+L+'</div>'; prev=L; } }
    const s=statusOf(o);
    const dot = s==="mastered"?"mastered":(s==="learning"?"learning":"");
    html+='<div class="ix-row" data-i="'+i+'"><span class="ix-dot '+dot+'"></span><span class="ix-w">'+o.w+'</span><span class="ix-p">'+o.p+'</span></div>';
  }
  $("ixList").innerHTML = html || '<div class="empty">No words match.</div>';
}
function highlightIndex(){
  const list=$("ixList");
  const was=list.querySelector(".ix-row.cur"); if(was) was.classList.remove("cur");
  const row=list.querySelector('.ix-row[data-i="'+pos+'"]');
  if(row){ row.classList.add("cur"); if(drawerOpen) row.scrollIntoView({block:"center"}); }
}
function openDrawer(){ drawerOpen=true; $("drawer").classList.add("open"); $("backdrop").classList.add("open"); $("drawer").setAttribute("aria-hidden","false"); highlightIndex(); }
function closeDrawer(){ drawerOpen=false; $("drawer").classList.remove("open"); $("backdrop").classList.remove("open"); $("drawer").setAttribute("aria-hidden","true"); }

/* ---- random study set of 20 not-mastered words ---- */
function pick20(){
  const pool = WORDS.filter(o=>statusOf(o)!=="mastered");
  if(pool.length===0){ alert("Every word is already mastered! Reset your progress to study again."); return; }
  const arr=pool.slice();
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  sessionList = arr.slice(0, Math.min(20, arr.length));
  sessionMode=true; query=""; $("search").value=""; $("clr").style.display="none";
  [...$("statusSeg").children].forEach(b=>b.classList.remove("on"));
  pos=0; lastSig=""; render();
}
function exitSession(){
  sessionMode=false; sessionList=[]; statusFilter="all";
  [...$("statusSeg").children].forEach(b=>b.classList.toggle("on", b.dataset.status==="all"));
  pos=0; lastSig=""; render();
}

function flip(){ flipped=!flipped; $("card").classList.toggle("flipped",flipped); }
function go(d){ if(deck.length===0)return; pos=(pos+d+deck.length)%deck.length; render(); }
function mark(state){
  if(deck.length===0)return;
  const w=deck[pos].w;
  if(progress[w]===state) delete progress[w]; else progress[w]=state;
  save(); pos=(pos+1)%deck.length; render();
}
function shuffle(){
  if(sessionMode){ for(let i=sessionList.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sessionList[i],sessionList[j]]=[sessionList[j],sessionList[i]];} pos=0; lastSig=""; render(); return; }
  for(let i=WORDS.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[WORDS[i],WORDS[j]]=[WORDS[j],WORDS[i]];} shuffled=true; pos=0; render();
}

$("card").addEventListener("click",flip);
$("prev").addEventListener("click",()=>go(-1));
$("next").addEventListener("click",()=>go(1));
$("btnReview").addEventListener("click",()=>mark("learning"));
$("btnGot").addEventListener("click",()=>mark("mastered"));
$("pick20").addEventListener("click",pick20);
$("bannerExit").addEventListener("click",exitSession);
$("shuffle").addEventListener("click",shuffle);
$("reset").addEventListener("click",()=>{ if(confirm("Reset all progress? This clears every mark.")){progress={};save();sessionMode=false;sessionList=[];[...$("statusSeg").children].forEach(b=>b.classList.toggle("on",b.dataset.status==="all"));statusFilter="all";pos=0;lastSig="";render();} });
$("statusSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;sessionMode=false;sessionList=[];statusFilter=b.dataset.status;[...$("statusSeg").children].forEach(x=>x.classList.toggle("on",x===b));pos=0;render();});
const searchEl=$("search");
searchEl.addEventListener("input",()=>{sessionMode=false;sessionList=[];query=searchEl.value;$("clr").style.display=query?"block":"none";if(![...$("statusSeg").children].some(x=>x.classList.contains("on"))){[...$("statusSeg").children].forEach(b=>b.classList.toggle("on",b.dataset.status===statusFilter));}pos=0;render();});
$("clr").addEventListener("click",()=>{query="";searchEl.value="";$("clr").style.display="none";searchEl.focus();pos=0;render();});

$("ixToggle").addEventListener("click",()=>{ drawerOpen?closeDrawer():openDrawer(); });
$("ixClose").addEventListener("click",closeDrawer);
$("backdrop").addEventListener("click",closeDrawer);
$("ixList").addEventListener("click",e=>{ const row=e.target.closest(".ix-row"); if(!row)return; pos=parseInt(row.dataset.i,10); render(); closeDrawer(); });

document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && drawerOpen){ closeDrawer(); return; }
  if(document.activeElement===searchEl){ if(e.key==="Escape"){searchEl.blur();} return; }
  if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}
  else if(e.key==="ArrowRight")go(1);
  else if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="ArrowUp"){e.preventDefault();mark("mastered");}
  else if(e.key==="ArrowDown"){e.preventDefault();mark("learning");}
});
let tx=0;
$("stage").addEventListener("touchstart",e=>{tx=e.touches[0].clientX;},{passive:true});
$("stage").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)go(dx<0?1:-1);},{passive:true});
render();
</script>
</body>
</html>

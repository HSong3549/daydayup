<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day Day Up — Study Pages</title>
<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f0f7ff;
    margin: 0;
    padding: 40px 20px;
    color: #2c3e50;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { text-align: center; color: #1a5fb4; }
  p.tagline { text-align: center; color: #5e81ac; margin-top: -10px; }
  ul.pages { list-style: none; padding: 0; margin-top: 30px; }
  ul.pages li { margin: 12px 0; }
  ul.pages a {
    display: block;
    background: #ffffff;
    border: 2px solid #cde3ff;
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 1.15em;
    text-decoration: none;
    color: #1a5fb4;
    transition: transform 0.1s, border-color 0.1s;
  }
  ul.pages a:hover {
    transform: translateY(-2px);
    border-color: #1a5fb4;
  }
  .visits {
    text-align: center;
    margin-top: 40px;
    color: #5e81ac;
    font-size: 0.95em;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 Day Day Up</h1>
  <p class="tagline">Good good study, day day up!</p>
  <ul class="pages">
    <li><a href="geography_map.html" target="_blank" rel="noopener">🗺️ Geography Map</a></li>
    <li><a href="vocab-flashcards.html" target="_blank" rel="noopener">🃏 Vocabulary Flashcards</a></li>
    <li><a href="ap_world_map.html" target="_blank" rel="noopener">🌍 AP World Geography Map</a></li>
    <!-- Add more study pages here, one line each:
    <li><a href="another_page.html" target="_blank" rel="noopener">✏️ Another Page</a></li>
    -->
  </ul>
  <p class="visits" id="visits"></p>
</div>
<script>
  fetch("https://abacus.jasoncameron.dev/hit/hsong3549-daydayup/homepage")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      document.getElementById("visits").textContent =
        "Total number of visits: " + data.value.toLocaleString();
    })
    .catch(function () { /* counter unavailable — show nothing */ });
</script>
</body>
</html>
